name: 地下城堡3 每周舆情周报

# 触发方式（2026-10-26 建立，与地下城堡4 同一架构）
#   主通道：外部服务器（Windows 任务计划）每周一 11:00 通过 API dispatch 触发 —— 准点
#   兜底：  schedule 仅作保险，GitHub 定时任务可能延迟数小时甚至一天
#   防重复：守卫会检查「近 6 天内是否已有成功的周报运行」，有则跳过，
#           可覆盖「周一准点已推、GitHub 延迟到周二才触发」这种情况。
# 报告页：https://linyy663.github.io/dc3-monitor/weekly/

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      no_push:
        description: '仅生成页面，跳过飞书推送'
        type: boolean
        default: false
      force:
        description: '忽略「本周已推送」检查，强制执行'
        type: boolean
        default: false

concurrency:
  group: dc3-weekly
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 防重复检查（本周是否已成功推送）
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "force=true，跳过防重复检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/weekly.yml/runs?status=success&per_page=20" \
                 --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .run_started_at" 2>/dev/null | head -1 || true)

          if [ -z "$LAST" ] || [ "$LAST" = "null" ]; then
            echo "无历史成功记录，继续执行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TS=$(date -d "$LAST" +%s)
          NOW_TS=$(date +%s)
          DAYS=$(( (NOW_TS - LAST_TS) / 86400 ))
          echo "上次成功=$LAST / 距今 ${DAYS} 天"

          if [ "$DAYS" -lt 6 ]; then
            echo "::notice::近 6 天内已成功推送过周报，跳过本次重复执行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 生成周报（不推送）
        if: steps.guard.outputs.skip != 'true'
        run: python dc3_report.py --weekly --no-push

      - name: 校验抓取结果
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/check_data.py weekly

      - name: 部署到 GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./data/dc3/html_report_weekly
          destination_dir: weekly
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: 等待页面可访问
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/dc3-monitor/weekly/"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$URL")
            echo "第${i}次探测: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::页面暂未返回 200，可能是 Pages 首次发布或 CDN 缓存延迟"
          exit 0

      - name: 推送飞书
        if: steps.guard.outputs.skip != 'true' && inputs.no_push != true
        run: |
          python dc3_report.py --weekly --push-only --report-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/dc3-monitor/weekly/"
