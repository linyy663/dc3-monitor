name: t5

# 触发方式（2026-10-26 建立，与地下城堡4 同一架构）
#   主通道：外部服务器（Windows 任务计划）每天 10:00 通过 API dispatch 触发 —— 准点
#   兜底：  schedule 仅作保险。GitHub 对低活跃仓库的定时任务会延迟数小时，
#           因此加了「今日已成功则跳过」守卫，避免兜底触发造成重复推送。
# 报告页：https://linyy663.github.io/dc3-monitor/daily/

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      no_push:
        description: '仅生成页面，跳过飞书推送'
        type: boolean
        default: false
      force:
        description: '忽略「今日已推送」检查，强制执行'
        type: boolean
        default: false

jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: echo hi
